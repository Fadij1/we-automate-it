<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Background Tile -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Robot Antenna -->
  <line x1="32" y1="13" x2="32" y2="7" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="7" r="2.5" fill="#0891b2" filter="url(#glow)" />

  <!-- Head Box -->
  <rect x="18" y="13" width="28" height="19" rx="6" fill="#0b0f19" stroke="#475569" stroke-width="2" />

  <!-- Glowing Cyan Eyes -->
  <circle cx="25" cy="22" r="3.2" fill="#0891b2" filter="url(#glow)" />
  <circle cx="39" cy="22" r="3.2" fill="#0891b2" filter="url(#glow)" />
  <circle cx="24.5" cy="21.5" r="1" fill="#ffffff" />
  <circle cx="38.5" cy="21.5" r="1" fill="#ffffff" />

  <!-- Neck -->
  <rect x="28.5" y="32" width="7" height="4" rx="1" fill="#475569" />

  <!-- Torso Box -->
  <rect x="17" y="36" width="30" height="20" rx="6" fill="#0b0f19" stroke="#475569" stroke-width="2" />

  <!-- Arc Reactor Chest Core -->
  <circle cx="32" cy="46" r="5" fill="#0891b2" filter="url(#glow)" />
  <circle cx="32" cy="46" r="2" fill="#ffffff" />

  <!-- Shoulder Arm Stems -->
  <line x1="17" y1="41" x2="10" y2="48" stroke="#0891b2" stroke-width="3" stroke-linecap="round" />
  <line x1="47" y1="41" x2="54" y2="48" stroke="#0891b2" stroke-width="3" stroke-linecap="round" />
</svg>
